[package]
name = "mp3tui"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
cpal = "0.18.2"
crossterm = "0.29.0"
lofty = "0.25.4"
ratatui = "0.30.2"
ringbuf = "0.5.2"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
symphonia = { version = "0.6.1", features = ["mp3", "flac", "ogg", "wav", "aac", "isomp4"] }
toml = "1.1.6"
